model:
  id: Qwen/Qwen3-ASR-1.7B
  dtype: float16
  device_map: cuda:0
  max_inference_batch_size: 1

input:
  manifest: data/jsonl/baseline_smoke.jsonl
  audio_root: /content/drive/MyDrive/qwen3-asr

inference:
  language: English
  max_new_tokens: 128

output:
  predictions_jsonl: outputs/baseline/predictions.qwen3_asr_base.smoke.jsonl
  scored_jsonl: outputs/baseline/predictions.qwen3_asr_base.smoke.scored.jsonl
  metrics_json: outputs/baseline/metrics.qwen3_asr_base.smoke.json
  metrics_by_scenario_csv: outputs/baseline/metrics_by_scenario.qwen3_asr_base.smoke.csv

runtime:
  seed: 42
  fail_fast: false
  limit: 2
