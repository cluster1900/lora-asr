model:
  id: google/gemma-4-12B-it
  dtype: float16
  device_map: auto
  trust_remote_code: false

input:
  manifest: data/jsonl/baseline_smoke.jsonl
  audio_root: /content/drive/MyDrive/gemma-mega-asr

generation:
  prompt: "Transcribe the following speech segment in its original language. Only output the transcription."
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0

output:
  predictions_jsonl: outputs/baseline/predictions.gemma4_base.smoke.jsonl
  scored_jsonl: outputs/baseline/predictions.gemma4_base.smoke.scored.jsonl
  metrics_json: outputs/baseline/metrics.gemma4_base.smoke.json
  metrics_by_scenario_csv: outputs/baseline/metrics_by_scenario.gemma4_base.smoke.csv

runtime:
  seed: 42
  fail_fast: false
  limit: 2
