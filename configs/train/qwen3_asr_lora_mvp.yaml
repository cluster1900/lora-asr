model:
  id: Qwen/Qwen3-ASR-1.7B
  quantization: 4bit
  backend: unsloth_preferred
  fallback_backend: transformers_peft

probe:
  output_dir: outputs/lora_probe/qwen3_asr_1_7b
  dtype: float16
  device_map: cuda:0
  max_inference_batch_size: 1
  max_new_tokens: 128

data:
  train_manifest: data/jsonl/train.jsonl
  validation_manifest: data/jsonl/val.jsonl
  max_audio_seconds: 20

lora:
  backend: unsloth_preferred
  r: 8
  alpha: 16
  dropout: 0.05
  target_strategy: audio_tower_attention_plus_projection_smoke
  target_groups:
    - audio_tower_attention
    - speech_projection
  include_regex:
    - ^model\.thinker\.audio_tower\.layers\.[0-9]+\.self_attn\.(q_proj|k_proj|v_proj|out_proj)$
    - ^model\.thinker\.audio_tower\.(conv_out|proj1|proj2)$
  exclude_regex:
    - ^model\.thinker\.lm_head$
    - ^model\.thinker\.model\.layers\.
    - ^model\.thinker\.audio_tower\.(conv2d1|conv2d2|conv2d3)$
  expected_target_count: 99
  estimated_trainable_params_r8: 1683456

training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00002
  epochs: 1
  seed: 42
  smoke_test_steps: 20

output:
  checkpoint_dir: checkpoints/qwen3-asr-1.7b-lora
  save_steps: 200
  keep_last_checkpoints: 3
