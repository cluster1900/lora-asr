schema_version: 1
decoding:
  # Same budget as official deployment. Also used for probe and held-out.
  max_new_tokens: 512
# v31 scale experiment (RL option B). Design: docs/qwen3-asr/29_rl_v31_scale_design.md
# Relative to v28/v29 only the scale changes: full rl_train_pool degraded
# (160,000 degraded rows, ~1 epoch in 2,560 steps), the `scale` stop profile,
# and eval/save every 320 steps. The launcher refuses a smaller formal pool.
# Reward, advantage, sampling and LoRA stay fixed. The v31 stability patch
# uses a smaller learning rate, longer warmup and stronger KL tether so the
# 10x run does not spend its budget on early policy drift.

model:
  model_id: /data/mega-asr/runs/dpo_pilot_v2/merged_base
  model_revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
  dtype: float16
  bf16: false
  tf32: false
  attention_implementation: eager
  flash_attention_2: false

runtime:
  device: cuda
  world_size: 4
  micro_batch_size: 1 # 1 audio prompt per forward pass
  gradient_accumulation_steps: 16 # effective batch = 1 * 16 * 4 = 64 prompts
  global_batch_size: 64
  gradient_checkpointing: true
  enable_input_require_grads: true
  root_dir: /data/mega-asr
  seed: 20260722
  dataloader_workers: 2

train:
  # Fresh start from the DPO Champion; 2,560 steps x 64 prompts = 163,840
  # degraded prompts, matching the 160,000-row RL data contract.
  max_steps: 2560
  save_steps: 320
  eval_steps: 320
  learning_rate: 2.0e-6
  apply_learning_rate_on_resume: false
  warmup_steps: 64
  lr_scheduler: constant
  loss_reduction: sequence_sum
  sample_strategy: degraded
  # Contract copies of STOP_PROFILES["scale"]; check_config_contract rejects
  # any change here that is not also made in train_rl.py, and rejects
  # pilot-only keys (step4/8/12 floors) under this profile.
  stop_profile: scale
  early_held_out_reward_drop: 0.005
  max_raw_kl: 2.0e-2
  futility_step: 640
  futility_min_gain: 0.0
  futility_patience: 2
  probe_mass_min: 17.0

grpo:
  policy_token_mask: signed_edits
  include_reference_candidate: true
  group_size: 4
  train_sequences: 2
  second_round:
    enabled: true
    sample_size: 8
    max_generate_batch: 4
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 50
  advantage:
    mode: raw_gap
    fixed_value: 0.10
    local_max_relative: 0.35
    zero_variance_threshold: 0.80
    collapse_mean_reward_floor: 0.75
    anchor: greedy
    min_improvement: 0.02
  kl_regularization:
    beta: 0.08

reward:
  # The trainer reads penalties and clip from this file only.
  config_path: configs/train/reward_config.yaml

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  train_audio_projections: true
  target_groups:
    projection: 3
    decoder_attention: 112
    decoder_mlp: 84
  expected_total_targets: 199
  projection_targets:
    - thinker.audio_tower.conv_out
    - thinker.audio_tower.proj1
    - thinker.audio_tower.proj2
  decoder_layers_count: 28
  decoder_attention_names:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  decoder_mlp_names:
    - gate_proj
    - up_proj
    - down_proj

lifecycle:
  strategy: merge_and_unload
  stages:
    rl:
      starting_model: /data/mega-asr/runs/dpo_pilot_v2/merged_base
      output_adapter: rl_release
      output_merged: rl_merged_base

gates:
  rl_pilot:
    held_out_decode: greedy
    held_out_mean_reward_improvement_min: 0.002
    min_degraded_scenario_improvements: 1
    clean_error_rate_increase_max: 0.02
    clean_cumulative_error_rate_increase_max: 0.025
    max_robust_macro_regression: 0.0
    valid_output_rate_min: 0.95
    max_empty_output_rate: 0.002
    failure_rate_increase_max: 0.05
