# 20-step Aligned Phase 4 RL pilot (group_pg_mixed_v1) on the published DPO step-40 release.
# Trains only on [noise, reverb, far_field] rollout groups with prefix/length-aligned
# punctuation-free substitution mask (loss_token_scope: mismatched_only, max_edit_count: 2),
# accumulates 4 real signal groups per optimizer step (accumulate_signal_groups_only: true),
# anchors dropout to the frozen DPO step-40 greedy hypothesis (dropout_anchor_weight: 0.05),
# and uses a damped post-DPO schedule (lr: 1e-6, warmup_steps: 5, scheduler_max_steps: 50, kl_beta: 0.10).
