schema_version: 1
run_name: qwen3-asr-public-a2s
seed: 20260722

model:
  id: Qwen/Qwen3-ASR-1.7B
  revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
  dtype: bfloat16
  attn_implementation: flash_attention_2

data:
  data_root: /content/qwen3-asr-runtime/data
  train_manifest: /content/drive/MyDrive/qwen3-asr-public-a2s/manifests/public_robust_200k_train.jsonl
  curriculum_manifest: /content/drive/MyDrive/qwen3-asr-public-a2s/manifests/public_robust_30k_curriculum.jsonl
  validation_manifest: /content/drive/MyDrive/qwen3-asr-public-a2s/manifests/public_robust_10k_val.jsonl
  canary_manifest: /content/drive/MyDrive/qwen3-asr-public-a2s/manifests/public_robust_512_canary.jsonl
  smoke_manifest: /content/drive/MyDrive/qwen3-asr-public-a2s/manifests/public_robust_smoke_128.jsonl
  sampling_rate: 16000

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  expected_groups:
    audio_attention: 96
    audio_mlp: 48
    projection: 3
    decoder_attention: 112
    decoder_mlp: 84
  expected_total: 343
  phase_1_upper_audio_layers: 4

training:
  per_device_batch_size: 4
  gradient_accumulation_steps: 32
  effective_batch_size: 128
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: linear
  logging_steps: 10
  save_steps: 200
  save_total_limit: 3
  dataloader_num_workers: 4
  gradient_checkpointing: true
  group_by_duration: true
  output_dir: /content/drive/MyDrive/qwen3-asr-public-a2s/runs/main

phases:
  - name: phase_1
    role: acoustic_curriculum
    manifest: curriculum_manifest
    logical_epochs: 2
    curriculum_thresholds: [0.30, 0.50, 0.70]
    active_scope: upper_audio_projection
    audio_learning_rate: 0.000001
    decoder_learning_rate: 0.0
    warmup_ratio: 0.05
  - name: phase_2
    role: semantic_adaptation
    manifest: train_manifest
    epochs: 1
    active_scope: decoder
    audio_learning_rate: 0.0
    decoder_learning_rate: 0.000001
    warmup_ratio: 0.05
  - name: phase_3
    role: joint_alignment
    manifest: train_manifest
    epochs: 1
    active_scope: all
    audio_learning_rate: 0.0000005
    decoder_learning_rate: 0.000001
    warmup_ratio: 0.03

evaluation:
  base_canary_metrics: /content/drive/MyDrive/qwen3-asr-public-a2s/base/validation_canary_512.metrics.json
  min_valid_output_rate: 0.95
  max_relative_robust_regression: 0.15
  max_failure_rate_increase: 0.05

release:
  adapter_dir: release/adapter
  manifest: release/release_manifest.json
