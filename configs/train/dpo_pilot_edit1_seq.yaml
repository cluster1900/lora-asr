# Single-character aligned-substitution DPO with full sequence loss.
# Same 164/118 in-memory filter and the same frozen gate as dpo_pilot_aligned.yaml.
# loss_token_scope is sequence. warmup_steps is 2, so step 1 uses 2.5e-6 and step 2 reaches 5e-6.
# eps stays 1e-6 and weight_decay stays 0.0. Do not resume 20261020T014427 or earlier DPO runs.
# Do not edit configs/train/dpo_pilot_aligned.yaml or the older DPO YAMLs.
# The 120 minute clock stays in this file. The launch sets
# QWEN3_ASR_DISABLE_RUNTIME_BUDGET=1 and the log must contain
# DPO_RUNTIME_BUDGET disabled. publishable stays false.
