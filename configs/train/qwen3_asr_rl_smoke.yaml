schema_version: 1

model:
  model_id: /data/mega-asr/runs/dpo_pilot_v2/merged_base
  model_revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
  dtype: float16
  bf16: false
  tf32: false
  attention_implementation: eager
  flash_attention_2: false

runtime:
  device: cuda
  world_size: 4
  micro_batch_size: 1
  gradient_accumulation_steps: 2
  global_batch_size: 8
  gradient_checkpointing: true
  enable_input_require_grads: true
  root_dir: /data/mega-asr
  seed: 20260722
  dataloader_workers: 2

train:
  max_steps: 5
  save_steps: 5
  eval_steps: 5
  val_eval_samples: 2
  learning_rate: 2.0e-6
  warmup_steps: 1
  lr_scheduler: linear

grpo:
  group_size: 4
  sampling:
    temperature: 0.85
    top_p: 0.92
    top_k: 50
  advantage:
    epsilon: 1.0e-6
    zero_variance_threshold: 0.30
  kl_regularization:
    beta: 0.04

reward:
  config_path: configs/train/reward_config.yaml
  clip:
    min: -1.0
    max: 1.0
  penalties:
    empty: -0.25
    repeat: -0.25
    too_long: -0.15
    too_long_ratio: 1.5
    hallucination: -0.25
    hallucination_error_threshold: 0.8

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_groups:
    projection: 3
    decoder_attention: 112
    decoder_mlp: 84
  expected_total_targets: 199
  projection_targets:
    - thinker.audio_tower.conv_out
    - thinker.audio_tower.proj1
    - thinker.audio_tower.proj2
  decoder_layers_count: 28
  decoder_attention_names:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  decoder_mlp_names:
    - gate_proj
    - up_proj
    - down_proj
