dataset:
  name: v6a_hard_profile
  purpose: v6a_hard_profile_data_alignment
  seed: 20260702
  profile: hard
  variants_per_utterance: 2
  absolute_paths: false

source:
  train_manifest: data/jsonl/lora_mvp_train.local.jsonl
  val_manifest: data/jsonl/lora_mvp_val.local.jsonl
  source_scenario: clean
  audio_root: .
  forbidden_path_fragments:
    - baseline_mvp_150
    - data/mvp_eval/audio

output:
  audio_dir: data/v6a_hard_profile/audio
  train_manifest: data/jsonl/v6a_hard_profile_train.local.jsonl
  val_manifest: data/jsonl/v6a_hard_profile_val.local.jsonl
  stats: data/jsonl/v6a_hard_profile_stats.local.json

scenarios:
  - clean
  - noise
  - reverb
  - noise_reverb
  - far_field
  - dropout
  - far_field_noise

quality_checks:
  require_audio_exists: true
  require_train_val_base_disjoint: true
  require_no_forbidden_paths: true
  expected_train_rows: 1680
  expected_val_rows: 420

next_steps:
  difficulty_notebook: notebooks/11_score_base_difficulty_colab.ipynb
  train_notebook: notebooks/12_train_lora_v6a_hard_profile_colab.ipynb
